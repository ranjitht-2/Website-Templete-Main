<!doctype html>
<html lang="en">
  <head>
    <base href="/templates/transportation/transportation-3/" />
    <script>(function(){if(window.location.pathname.endsWith('/index.html')){window.history.replaceState(null,'',window.location.pathname.slice(0,-10)+window.location.search+window.location.hash);}})();</script>

    <!-- TechnoSprint Responsive Device Preview Switcher -->
    <style id="technosprint-preview-styles">
      * { box-sizing: border-box; }
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        overflow: hidden !important;
        background-color: #0b0f19 !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      }
      #technosprint-preview-header {
        height: 60px !important;
        min-height: 60px !important;
        background: #0f172a !important;
        border-bottom: 1px solid #1e293b !important;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        padding: 0 20px !important;
        z-index: 99999 !important;
        position: relative !important;
      }
      .device-switcher-bar {
        display: inline-flex !important;
        align-items: center !important;
        background: #020617 !important;
        border: 1px solid #1e293b !important;
        border-radius: 10px !important;
        padding: 4px !important;
        gap: 4px !important;
      }
      .device-btn {
        background: transparent !important;
        color: #94a3b8 !important;
        border: none !important;
        padding: 7px 18px !important;
        border-radius: 8px !important;
        font-size: 0.85rem !important;
        font-weight: 500 !important;
        cursor: pointer !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 7px !important;
        transition: all 0.2s ease-in-out !important;
        outline: none !important;
        user-select: none !important;
      }
      .device-btn * {
        pointer-events: none !important;
      }
      .device-btn:hover {
        background: #1e293b !important;
        color: #f8fafc !important;
      }
      .device-btn.active {
        background: #2563EB !important;
        color: #ffffff !important;
        font-weight: 600 !important;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4) !important;
      }
      #preview-canvas {
        flex: 1 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 16px !important;
        overflow: auto !important;
        position: relative !important;
        background-color: #0b0f19 !important;
        background-image: radial-gradient(#1e293b 1.2px, transparent 1.2px) !important;
        background-size: 24px 24px !important;
      }
      #preview-canvas.desktop-mode {
        padding: 0px !important;
      }
      #device-frame {
        position: relative !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
        flex-shrink: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background: #ffffff !important;
        transition: width 300ms ease-in-out, height 300ms ease-in-out, max-width 300ms ease-in-out, max-height 300ms ease-in-out, border-radius 300ms ease-in-out, box-shadow 300ms ease-in-out !important;
      }
      #device-frame.mode-desktop {
        width: 100% !important;
        max-width: 100% !important;
        height: 100% !important;
        max-height: 100% !important;
        border: none !important;
        border-radius: 0px !important;
        box-shadow: none !important;
      }
      #device-frame.mode-tablet {
        width: 768px !important;
        max-width: calc(100vw - 32px) !important;
        height: 1024px !important;
        max-height: calc(100vh - 100px) !important;
        border: 12px solid #1e293b !important;
        border-radius: 32px !important;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1) !important;
      }
      #device-frame.mode-mobile {
        width: 375px !important;
        max-width: calc(100vw - 24px) !important;
        height: 812px !important;
        max-height: calc(100vh - 90px) !important;
        border: 12px solid #1e293b !important;
        border-radius: 44px !important;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.12) !important;
      }
      #preview-iframe {
        width: 100% !important;
        height: 100% !important;
        border: none !important;
        background: #ffffff !important;
        flex: 1 !important;
      }
    </style>
    <script>
      (function() {
        const isTop = window.self === window.top;
        const urlParams = new URLSearchParams(window.location.search);
        const isIframe = urlParams.get('iframe') === 'true';
        
        if (isTop && !isIframe) {
          function buildPreviewWrapper() {
            const body = document.body;
            if (!body) {
              setTimeout(buildPreviewWrapper, 10);
              return;
            }
            if (document.getElementById('technosprint-preview-header')) return;

            const currentUrl = new URL(window.location.href);
            currentUrl.searchParams.set('iframe', 'true');
            
            document.documentElement.className = '';
            document.documentElement.removeAttribute('style');
            
            body.className = '';
            body.innerHTML = '';
            body.removeAttribute('style');
            body.style.cssText = 'margin: 0 !important; padding: 0 !important; height: 100vh !important; width: 100vw !important; display: flex !important; flex-direction: column !important; overflow: hidden !important; background-color: #0b0f19 !important;';
            
            // Top Navigation Bar
            const topBar = document.createElement('header');
            topBar.id = 'technosprint-preview-header';
            
            // Left: Logo + Back button
            const logoDiv = document.createElement('div');
            logoDiv.style.cssText = 'display: flex; align-items: center; gap: 14px;';
            logoDiv.innerHTML = '' +
              '<a href="/templates" style="display: flex; align-items: center; text-decoration: none;" title="Back to Marketplace">' +
              '  <img src="/logo.png" alt="Logo" style="height: 28px;" onerror="this.style.display=\'none\'" />' +
              '</a>' +
              '<a href="/templates" style="display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; color: #94a3b8; text-decoration: none; padding: 6px 12px; border-radius: 8px; background: #1e293b; border: 1px solid #334155; transition: all 0.2s;" onmouseover="this.style.color=\'#ffffff\';this.style.background=\'#334155\'" onmouseout="this.style.color=\'#94a3b8\';this.style.background=\'#1e293b\'">' +
              '  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Back' +
              '</a>';
            topBar.appendChild(logoDiv);
            
            // Center: Responsive Switcher with ONLY "Desktop", "Tablet", "Mobile"
            const switcherDiv = document.createElement('div');
            switcherDiv.className = 'device-switcher-bar';
            
            switcherDiv.innerHTML = '' +
              '<button id="view-desktop" class="device-btn active">' +
              '  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>' +
              '  <span>Desktop</span>' +
              '</button>' +
              '<button id="view-tablet" class="device-btn">' +
              '  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>' +
              '  <span>Tablet</span>' +
              '</button>' +
              '<button id="view-mobile" class="device-btn">' +
              '  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>' +
              '  <span>Mobile</span>' +
              '</button>';
            topBar.appendChild(switcherDiv);
            
            // Right: Refresh button
            const rightDiv = document.createElement('div');
            rightDiv.style.cssText = 'display: flex; align-items: center; gap: 10px;';
            rightDiv.innerHTML = '' +
              '<button id="btn-refresh" style="display: flex; align-items: center; justify-content: center; background: #1e293b; border: 1px solid #334155; border-radius: 8px; width: 34px; height: 34px; color: #e2e8f0; cursor: pointer; transition: all 0.2s;" title="Reload">' +
              '  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>' +
              '</button>';
            topBar.appendChild(rightDiv);
            body.appendChild(topBar);
            
            // Canvas Area (Flexbox Centered)
            const canvas = document.createElement('main');
            canvas.id = 'preview-canvas';
            canvas.className = 'desktop-mode';
            
            // Device Frame (Viewport Container)
            const frameContainer = document.createElement('div');
            frameContainer.id = 'device-frame';
            frameContainer.className = 'mode-desktop';
            
            // Iframe displaying template content
            const iframe = document.createElement('iframe');
            iframe.id = 'preview-iframe';
            iframe.src = currentUrl.toString();
            
            frameContainer.appendChild(iframe);
            canvas.appendChild(frameContainer);
            body.appendChild(canvas);
            
            const btnDesktop = body.querySelector('#view-desktop');
            const btnTablet = body.querySelector('#view-tablet');
            const btnMobile = body.querySelector('#view-mobile');
            const btnRefresh = body.querySelector('#btn-refresh');
            
            function setDeviceMode(mode) {
              btnDesktop.classList.toggle('active', mode === 'desktop');
              btnTablet.classList.toggle('active', mode === 'tablet');
              btnMobile.classList.toggle('active', mode === 'mobile');
              
              canvas.className = mode === 'desktop' ? 'desktop-mode' : '';
              frameContainer.className = 'mode-' + mode;
            }
            
            btnDesktop.addEventListener('click', (e) => {
              e.preventDefault();
              setDeviceMode('desktop');
            });
            
            btnTablet.addEventListener('click', (e) => {
              e.preventDefault();
              setDeviceMode('tablet');
            });
            
            btnMobile.addEventListener('click', (e) => {
              e.preventDefault();
              setDeviceMode('mobile');
            });
            
            btnRefresh.addEventListener('click', (e) => {
              e.preventDefault();
              iframe.src = currentUrl.toString();
            });

            // Set desktop by default
            setDeviceMode('desktop');
          }
          
          if (document.readyState === 'interactive' || document.readyState === 'complete') {
            buildPreviewWrapper();
          } else {
            window.addEventListener('DOMContentLoaded', buildPreviewWrapper);
            window.addEventListener('load', buildPreviewWrapper);
          }
        }
      })();
    </script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleetrise — Telemetry Control Center</title>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
